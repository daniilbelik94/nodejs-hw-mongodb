get:
  tags:
    - Contacts
  summary: Get a contact by ID
  operationId: getContactById
  description: Retrieves a single contact by its ID for the authenticated user.
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      required: true
      schema:
        type: string
      description: The ID of the contact to retrieve
  responses:
    '200':
      description: Successfully retrieved the contact
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully found contact!
              data:
                $ref: ../../components/contact.yaml#/Contact
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Contact not found!
              data:
                type: object
                nullable: true
                example: null