tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Creates a new contact for the authenticated user. Supports uploading a photo.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: John Doe
          phoneNumber:
            type: string
            example: "+1234567890"
          email:
            type: string
            example: john.doe@example.com
            nullable: true
          isFavourite:
            type: boolean
            example: false
          contactType:
            type: string
            enum: [work, home, personal]
            example: personal
          photo:
            type: string
            format: binary
            nullable: true
        required:
          - name
          - phoneNumber
          - contactType
responses:
  '201':
    description: Successfully created a contact
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              properties:
                _id:
                  type: string
                  example: 1234567890abcdef12345678
                name:
                  type: string
                  example: John Doe
                phoneNumber:
                  type: string
                  example: "+1234567890"
                email:
                  type: string
                  example: john.doe@example.com
                  nullable: true
                isFavourite:
                  type: boolean
                  example: false
                contactType:
                  type: string
                  enum: [work, home, personal]
                  example: personal
                userId:
                  type: string
                  example: 9876543210fedcba09876543
                photo:
                  type: string
                  example: https://res.cloudinary.com/dtc7bl9mp/image/upload/v1234567890/photo.jpg
                  nullable: true
                createdAt:
                  type: string
                  format: date-time
                  example: 2023-10-01T12:00:00Z
                updatedAt:
                  type: string
                  format: date-time
                  example: 2023-10-01T12:00:00Z
  '400':
    description: Invalid request body
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Invalid request body
            data:
              type: object
              nullable: true
              example: null