tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Retrieves a list of contacts for the authenticated user with pagination and filtering.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      default: 1
    description: Page number for pagination
  - in: query
    name: perPage
    schema:
      type: integer
      default: 10
    description: Number of contacts per page
  - in: query
    name: sortBy
    schema:
      type: string
      enum: [name, phoneNumber, email, isFavourite, contactType, createdAt, updatedAt]
      default: name
    description: Field to sort by
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
      default: asc
    description: Sort order
  - in: query
    name: type
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter by contact type
  - in: query
    name: isFavourite
    schema:
      type: string
      enum: ['true', 'false']
    description: Filter by whether the contact is a favourite
responses:
  '200':
    description: Successfully retrieved contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: 1234567890abcdef12345678
                      name:
                        type: string
                        example: John Doe
                      phoneNumber:
                        type: string
                        example: "+1234567890"
                      email:
                        type: string
                        example: john.doe@example.com
                        nullable: true
                      isFavourite:
                        type: boolean
                        example: false
                      contactType:
                        type: string
                        enum: [work, home, personal]
                        example: personal
                      photo:
                        type: string
                        example: https://res.cloudinary.com/dtc7bl9mp/image/upload/v1234567890/photo.jpg
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                        example: 2023-10-01T12:00:00Z
                      updatedAt:
                        type: string
                        format: date-time
                        example: 2023-10-01T12:00:00Z
                page:
                  type: integer
                  example: 1
                  description: Current page number
                perPage:
                  type: integer
                  example: 10
                  description: Number of contacts per page
                totalItems:
                  type: integer
                  example: 0
                  description: Total number of contacts matching the query
                totalPages:
                  type: integer
                  example: 0
                  description: Total number of pages
                hasPreviousPage:
                  type: boolean
                  example: false
                  description: Whether there is a previous page
                hasNextPage:
                  type: boolean
                  example: false
                  description: Whether there is a next page